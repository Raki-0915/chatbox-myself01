name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Inject mod build version
        run: |
          VER="fork版_$(TZ=Asia/Shanghai date +%Y%m%d%H%M)"
          sed -i "s/__MOD_BUILD__/${VER}/" src/renderer/modules/version.ts
          grep -n "MOD_BUILD" src/renderer/modules/version.ts

      - name: Build renderer (mobile target)
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          CHATBOX_BUILD_TARGET: mobile_app
          CHATBOX_BUILD_PLATFORM: android
          CHATBOX_ELECTRON_VITE_TARGET: renderer
        run: npx electron-vite build

      - name: Capacitor sync android
        run: npx cap sync android

      - name: Apply Android manifest fixes (after cap sync)
        run: |
          MP=android/app/src/main/AndroidManifest.xml
          if ! grep -q windowOptOutEdgeToEdgeEnforcement "$MP"; then
            sed -i 's|<application|    <application\n        android:windowOptOutEdgeToEdgeEnforcement="true"|' "$MP"
          fi
          grep -c windowOptOutEdgeToEdgeEnforcement "$MP"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        working-directory: android
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/aligned.apk
          "$BT/apksigner" sign \
            --ks keystore/chatbox-mod.keystore \
            --ks-key-alias chatbox-mod \
            --ks-pass pass:chatbox123 \
            --key-pass pass:chatbox123 \
            --out app/build/outputs/apk/release/chatbox-mod.apk \
            app/build/outputs/apk/release/aligned.apk
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/chatbox-mod.apk

      - name: Generate changelog
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            LOG=$(git log --oneline --no-merges "$PREV..HEAD" | sed 's/^/- /')
          else
            LOG=$(git log --oneline --no-merges | sed 's/^/- /')
          fi
          {
            echo "body<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Chatbox Mod v${{ github.run_number }}
          body: |
            ## 本版改动
            ${{ steps.changelog.outputs.body }}

            ## 安装说明
            - APK 已签名（chatbox-mod.keystore），**可直接安装**
            - 与之前版本同签名，**可覆盖安装**（数据保留）
            - 包名：xyz.chatboxapp.chatbox
          files: android/app/build/outputs/apk/release/chatbox-mod.apk
